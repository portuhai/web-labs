<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Updates</title>
  <link rel="stylesheet" href="blog_upd.css" />
</head>
<body>
  <div class="background-overlay"></div>
  <div class="container">
    <h1>New Articles</h1>
    <form id="articleForm">
      <input type="text" id="title" placeholder="Title" required />
      <input type="text" id="text" placeholder="Text" required />
      <button type="submit">Add Article</button>
    </form>
    <input type="text" id="searchInput" placeholder="🔍 Search articles..." />
    <select id="sortSelect">
      <option value="">Sort by...</option>
      <option value="title_asc">Title ↑</option>
      <option value="title_desc">Title ↓</option>
      <option value="length_asc">Short → Long</option>
      <option value="length_desc">Long → Short</option>
    </select>
    <div id="articlesList" class="articles-grid"></div>
    <div class="total-info" id="totalInfo">Total characters: 0</div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit Article</h2>
      <input type="text" id="editTitle" placeholder="New title" />
      <textarea id="editText" placeholder="New text"></textarea>
      <div class="modal-actions">
        <button id="saveEdit">Save</button>
        <button id="cancelEdit" class="cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h2>Delete Article?</h2>
      <p>Are you sure you want to delete this article?</p>
      <div class="modal-actions">
        <button id="confirmDelete">Yes, delete</button>
        <button id="cancelDelete" class="cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="blog.js"></script>
</body>
</html>
